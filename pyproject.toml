[project]
name = "lgtv-core"
version = "0.1.0"
description = "Local HTTP daemon for controlling LG webOS TVs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "deepanshutr" }]
keywords = ["lg", "webos", "tv", "smart-home", "remote-control"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]
dependencies = [
    "aiowebostv>=0.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "wakeonlan>=3.1",
    "httpx>=0.27",
    "typer>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
lgtv-core = "lgtv_core.cli:app"

[project.urls]
Homepage = "https://github.com/deepanshutr/lgtv-core"
Issues = "https://github.com/deepanshutr/lgtv-core/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: requires a real, paired TV reachable at LGTV_HOST"]
